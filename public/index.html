<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prato Cheio</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 40rem; }
    h1 { font-size: 1.3rem; }
    fieldset { border: 1px solid #ccc; border-radius: .5rem; margin-bottom: 1rem; }
    label { display: block; margin: .5rem 0 .2rem; font-size: .9rem; }
    input, button { font-size: 1rem; padding: .6rem; width: 100%; box-sizing: border-box; }
    button { margin-top: .8rem; cursor: pointer; }
    li { border: 1px solid #ddd; border-radius: .5rem; padding: .6rem; margin-bottom: .5rem; list-style: none; }
    ul { padding: 0; }
  </style>
</head>
<body>
  <h1>Prato Cheio</h1>

  <fieldset>
    <legend>Publicar doação</legend>
    <label for="tipo">Tipo de alimento</label>
    <input id="tipo" placeholder="Ex.: sopa, pão, frutas">
    <label for="quantidade">Quantidade</label>
    <input id="quantidade" placeholder="Ex.: 10 porções">
    <label for="validade">Validade / retirar até</label>
    <input id="validade" type="date">
    <button id="publicar">Publicar</button>
  </fieldset>

  <h2>Doações disponíveis</h2>
  <ul id="lista"></ul>

  <h2>Confirmar reserva ativa (Decisão 2 - Aula 6)</h2>
  <fieldset>
    <legend>Confirmar coleta da doação reservada</legend>
    <label for="idReserva">ID da doação reservada</label>
    <input id="idReserva" type="number" placeholder="Ex.: 1">
    <label for="ongConfirmar">Nome da ONG que reservou</label>
    <input id="ongConfirmar" placeholder="Ex.: ONG Esperança">
    <button id="btnConfirmar" type="button">Confirmar Coleta</button>
  </fieldset>

  <script>
    async function carregar() {
      const res = await fetch('/api/doacoes');
      const doacoes = await res.json();
      const lista = document.getElementById('lista');
      lista.innerHTML = doacoes.length
        ? ''
        : '<li>Nenhuma doação disponível no momento.</li>';
      for (const d of doacoes) {
        const li = document.createElement('li');
        li.innerHTML = `<strong>#${d.id} - ${d.tipo}</strong> — ${d.quantidade} (validade: ${d.validade})<br>`;
        
        const btnReservar = document.createElement('button');
        btnReservar.textContent = 'Reservar (tolerância 20 min)';
        btnReservar.style.backgroundColor = '#f0ad4e';
        btnReservar.onclick = async () => {
          const ong = prompt('Informe o nome da ONG para a reserva:', 'ONG Esperança');
          if (!ong) return;
          const r = await fetch(`/api/doacoes/${d.id}/reservar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ong })
          });
          const json = await r.json();
          if (r.ok) {
            alert(`Doação #${d.id} reservada com sucesso para ${ong}! Guarde o ID para confirmar a coleta.`);
          } else {
            alert('Erro: ' + (json.erro || 'Falha ao reservar'));
          }
          carregar();
        };

        const btnAceitar = document.createElement('button');
        btnAceitar.textContent = 'Aceitar Imediato';
        btnAceitar.onclick = async () => {
          const ong = prompt('Informe o nome da ONG:', 'ONG Esperança');
          if (!ong) return;
          const r = await fetch(`/api/doacoes/${d.id}/aceitar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ong })
          });
          const json = await r.json();
          if (r.ok) {
            alert(`Doação #${d.id} aceita com sucesso por ${ong}!`);
          } else {
            alert('Erro: ' + (json.erro || 'Falha ao aceitar'));
          }
          carregar();
        };

        li.appendChild(btnReservar);
        li.appendChild(btnAceitar);
        lista.appendChild(li);
      }
    }

    document.getElementById('publicar').onclick = async () => {
      const tipo = document.getElementById('tipo').value;
      const quantidade = document.getElementById('quantidade').value;
      const validade = document.getElementById('validade').value;
      const res = await fetch('/api/doacoes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tipo, quantidade, validade })
      });
      if (res.ok) {
        document.getElementById('tipo').value = '';
        document.getElementById('quantidade').value = '';
        document.getElementById('validade').value = '';
        carregar();
      } else {
        const json = await res.json();
        alert('Erro ao publicar: ' + json.erro);
      }
    };

    document.getElementById('btnConfirmar').onclick = async () => {
      const id = document.getElementById('idReserva').value;
      const ong = document.getElementById('ongConfirmar').value;
      if (!id || !ong) {
        alert('Preencha o ID e o nome da ONG.');
        return;
      }
      const res = await fetch(`/api/doacoes/${id}/confirmar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ong })
      });
      const json = await res.json();
      if (res.ok) {
        alert(`Reserva da doação #${id} confirmada com sucesso! Status atualizado para 'aceita'.`);
        document.getElementById('idReserva').value = '';
        document.getElementById('ongConfirmar').value = '';
        carregar();
      } else {
        alert('Erro ao confirmar: ' + (json.erro || 'Falha na confirmação'));
      }
    };

    carregar();
  </script>
</body>
</html>
